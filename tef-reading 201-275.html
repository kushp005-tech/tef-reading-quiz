    let currentMode = 'order';
    let currentPool = [];
    let currentIndex = 0;
    let score = 0;
    let totalAnswered = 0;
    let mistakes = new Set();
    let examAnswers = [];

    function updateStats() {
        if (currentMode === 'exam') return; 
        let pct = totalAnswered === 0 ? 0 : Math.round((score / totalAnswered) * 100);
        document.getElementById('stats-display').innerText = `Score: ${score} / ${totalAnswered} | Accuracy: ${pct}%`;
        document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} / ${currentPool.length}`;
    }

    function startMode(mode) {
        currentMode = mode;
        score = 0;
        totalAnswered = 0;
        currentIndex = 0;
        examAnswers = [];
        
        document.getElementById('quiz-container').classList.remove('hidden');
        document.getElementById('exam-summary').classList.add('hidden');

        if (mode === 'order' || mode === 'exam') {
            currentPool = [...questions];
            if (mode === 'exam') {
                document.getElementById('stats-display').innerText = "EXAM MODE (Answers hidden until end)";
            }
        } else if (mode === 'random') {
            currentPool = [...questions].sort(() => Math.random() - 0.5);
        } else if (mode === 'review') {
            currentPool = questions.filter(q => mistakes.has(q.id));
            if (currentPool.length === 0) {
                alert("Aucune erreur à réviser ! / No mistakes to review!");
                startMode('order');
                return;
            }
        }
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentPool.length) {
            if (currentMode === 'exam') showExamSummary();
            return;
        }

        const q = currentPool[currentIndex];
        document.getElementById('passage-text').innerText = q.passage;
        document.getElementById('question-text').innerText = q.question;
        document.getElementById('explanation-container').style.display = 'none';
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx, btn);
            optsContainer.appendChild(btn);
        });

        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('prev-btn').classList.toggle('hidden', currentIndex === 0 || currentMode === 'exam');
        updateStats();
    }

    function selectAnswer(selectedIndex, btnNode) {
        const q = currentPool[currentIndex];
        const optsContainer = document.getElementById('options-container');
        const buttons = optsContainer.getElementsByTagName('button');
        
        for (let b of buttons) b.disabled = true;

        if (currentMode === 'exam') {
            examAnswers.push({ id: q.id, selected: selectedIndex, correct: q.correctIndex });
            btnNode.style.borderColor = "var(--text)";
            document.getElementById('next-btn').classList.remove('hidden');
            return;
        }

        totalAnswered++;
        const isCorrect = (selectedIndex === q.correctIndex);
        
        if (isCorrect) {
            score++;
            btnNode.classList.add('correct');
            document.getElementById('verdict-title').innerText = "✓ Correct";
            document.getElementById('verdict-title').style.color = "var(--correct)";
            if(currentMode === 'review') mistakes.delete(q.id); 
        } else {
            btnNode.classList.add('incorrect');
            buttons[q.correctIndex].classList.add('correct');
            document.getElementById('verdict-title').innerText = "✗ Incorrect";
            document.getElementById('verdict-title').style.color = "var(--incorrect)";
            mistakes.add(q.id);
        }

        document.getElementById('explanation-text').innerHTML = q.explanation.replace(/\n/g, '<br>');
        const vocabList = document.getElementById('vocab-list');
        vocabList.innerHTML = '';
        q.vocabulary.forEach(v => {
            let li = document.createElement('li');
            li.innerText = v;
            vocabList.appendChild(li);
        });
        
        document.getElementById('explanation-container').style.display = 'block';
        document.getElementById('next-btn').classList.remove('hidden');
        updateStats();
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function showExamSummary() {
        document.getElementById('quiz-container').classList.add('hidden');
        document.getElementById('exam-summary').classList.remove('hidden');
        
        let correctCount = examAnswers.filter(a => a.selected === a.correct).length;
        let pct = Math.round((correctCount / examAnswers.length) * 100);
        
        examAnswers.forEach(a => { if(a.selected !== a.correct) mistakes.add(a.id); });
        
        document.getElementById('exam-results').innerHTML = `
            Total Score: ${correctCount} / ${examAnswers.length}<br>
            Percentage: ${pct}%<br>
            Incorrect Answers Logged: ${examAnswers.length - correctCount}
        `;
        document.getElementById('stats-display').innerText = `Exam Finished - ${pct}%`;
    }

    window.onload = () => startMode('order');
</script>
</body>
</html>
