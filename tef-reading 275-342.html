            btnNode.classList.add('incorrect');
            buttons[q.correctIndex].classList.add('correct');
            document.getElementById('verdict-title').innerText = "✗ Incorrect";
            document.getElementById('verdict-title').style.color = "var(--incorrect)";
            mistakes.add(q.id);
        }

        document.getElementById('explanation-text').innerHTML = q.explanation.replace(/\n/g, '<br>');
        
        document.getElementById('explanation-container').style.display = 'block';
        document.getElementById('next-btn').classList.remove('hidden');
        updateStats();
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function showExamSummary() {
        document.getElementById('quiz-container').classList.add('hidden');
        document.getElementById('exam-summary').classList.remove('hidden');
        
        let correctCount = examAnswers.filter(a => a.selected === a.correct).length;
        let pct = Math.round((correctCount / examAnswers.length) * 100);
        
        examAnswers.forEach(a => { if(a.selected !== a.correct) mistakes.add(a.id); });
        
        document.getElementById('exam-results').innerHTML = `
            Score total: ${correctCount} / ${examAnswers.length}<br>
            Pourcentage: ${pct}%<br>
            Réponses incorrectes enregistrées: ${examAnswers.length - correctCount}
        `;
        document.getElementById('stats-display').innerText = `Examen terminé - ${pct}%`;
    }

    // Lancement de l'application
    window.onload = () => startMode('order');
</script>
</body>
</html>
